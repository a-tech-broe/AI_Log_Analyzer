services:
  analyzer:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - "${HOME}/.aws:/home/appuser/.aws:ro"
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  ollama_data:
